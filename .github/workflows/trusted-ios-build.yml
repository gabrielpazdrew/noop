# Trusted iOS build — unsigned sideload IPA + provenance attestation (fork-only; branch phone-hub).
#
# Why this exists: we sideload NOOP on the iPhone with SideStore, but never install upstream's
# release binary — only an IPA built here, from audited source (upstream tag v12.0.0, 7acce06c),
# with a GitHub build-provenance attestation binding the IPA's sha256 to this repo + workflow +
# commit. Verify locally: `gh attestation verify <ipa> --repo gabrielpazdrew/noop`.
#
# The build/package steps reproduce upstream fork-release.yml's `ios` job at v12.0.0 (Release,
# signing off, Watch app stripped, widget kept, Tools/prepare-ios-sideload-app.sh, zip Payload/),
# minus the release upload. Trigger is manual only.
name: Trusted iOS build

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write        # OIDC identity for sigstore signing of the attestation
  attestations: write    # store the provenance attestation on the repo

jobs:
  build:
    # iOS 26 Liquid Glass (glassEffect) needs the iOS 26 SDK → Xcode 26 → macos-26 (same as upstream).
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Record exact source commit
        run: git log --oneline -1

      # Known unpinned-tooling gap (upstream issue #657): Homebrew has no versioned xcodegen formula.
      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Release, not Debug: a Debug build carries get-task-allow and fails re-signed sideload (#53).
      - name: Build NOOPiOS for device (unsigned, Release)
        run: >-
          xcodebuild -scheme NOOPiOS -configuration Release -destination 'generic/platform=iOS'
          -derivedDataPath build/dd
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          build

      - name: Package sideload .ipa (strip watch, keep widget, embed capability template)
        id: pkg
        run: |
          set -euo pipefail
          APP=$(find build/dd/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -type d | head -1)
          test -n "$APP" || { echo "::error::.app (iphoneos) not found"; exit 1; }
          rm -rf "$APP/Watch"
          # Keep NOOPWidgets.appex: it renders the widgets AND the Live Activity.
          test -d "$APP/PlugIns/NOOPWidgets.appex" || {
            echo "::error::NOOPWidgets.appex missing from iOS build"; exit 1;
          }
          Tools/prepare-ios-sideload-app.sh "$APP"
          echo "--- app entitlements (ad-hoc template; SideStore re-signs) ---"
          codesign -d --entitlements :- "$APP" 2>/dev/null || true
          echo "--- widget entitlements ---"
          codesign -d --entitlements :- "$APP/PlugIns/NOOPWidgets.appex" 2>/dev/null || true
          VER=$(grep -m1 'MARKETING_VERSION:' project.yml | sed -E 's/.*"([^"]+)".*/\1/')
          IPA="NOOP-ios-trusted-v${VER}-${GITHUB_SHA::12}.ipa"
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          zip -qr "$IPA" Payload
          SHA=$(shasum -a 256 "$IPA" | awk '{print $1}')
          echo "$SHA  $IPA"
          echo "ipa=$IPA" >> "$GITHUB_OUTPUT"
          {
            echo "### Trusted iOS build"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| IPA | \`${IPA}\` |"
            echo "| sha256 | \`${SHA}\` |"
            echo ""
            echo "Verify: \`gh attestation verify ${IPA} --repo ${GITHUB_REPOSITORY}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Provenance is attested over the IPA itself (the exact bytes sideloaded), not the artifact
      # wrapper upload-artifact adds around it.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.pkg.outputs.ipa }}

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NOOP-ios-trusted
          path: ${{ steps.pkg.outputs.ipa }}
          if-no-files-found: error
