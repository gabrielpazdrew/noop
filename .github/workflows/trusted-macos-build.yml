# Trusted macOS build — sandboxed + provenance-attested (fork-only; branch trusted-build).
#
# Why this exists: the upstream-shipped NOOP.app is hand-built and ad-hoc re-signed with
# NO entitlements (unsandboxed — see fork-release.yml's macos job and
# Tools/anonymize-macos-app.sh), so the shipped binary is neither sandboxed nor
# attributable to source. This workflow builds the audited source (this branch, frozen at
# 7d7fe41f + this workflow file only), applies the sandbox entitlements the project itself
# declares (Strand/Resources/Strand.entitlements, regenerated by xcodegen from
# project.yml), signs ad-hoc with hardened runtime, and emits a GitHub build-provenance
# attestation binding the zip's sha256 to this repo + workflow + commit — verifiable
# locally with `gh attestation verify <zip> --repo <owner>/noop`.
name: Trusted macOS build

on:
  push:
    branches: [trusted-build]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write        # OIDC identity for sigstore signing of the attestation
  attestations: write    # store the provenance attestation on the repo

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Record exact source commit
        run: git log --oneline -1

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Release (not the Debug config fork-release.yml ships): optimized, no debug
      # artifacts, and project.yml already pins ONLY_ACTIVE_ARCH: NO for Release.
      # Generic destination + explicit ARCHS per #51 so an Apple-Silicon runner
      # cannot silently thin the binary to arm64-only.
      - name: Build Strand (Release, universal, unsigned)
        run: >-
          xcodebuild -scheme Strand -configuration Release
          -destination 'generic/platform=macOS' ARCHS="x86_64 arm64" ONLY_ACTIVE_ARCH=NO
          -derivedDataPath build/dd
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          build

      - name: Verify universal binary
        run: |
          set -euo pipefail
          APP=$(find build/dd/Build/Products -maxdepth 3 -name '*.app' -type d | head -1)
          EXE="$APP/Contents/MacOS/$(defaults read "$PWD/$APP/Contents/Info" CFBundleExecutable)"
          echo "archs: $(lipo -archs "$EXE")"
          { lipo -archs "$EXE" | grep -qw x86_64 && lipo -archs "$EXE" | grep -qw arm64; } \
            || { echo "::error::binary is not universal (expected x86_64 + arm64)"; exit 1; }

      # Unlike the shipped build (bare `codesign --deep --sign -`, no entitlements), sign
      # WITH the project's own sandbox entitlements and the hardened runtime. Nested code
      # is signed first — the outer signature seals the nested ones. The bundle is renamed
      # to NOOP.app before signing (PRODUCT_NAME at this commit is "NOOP Staging"; the
      # display name is already NOOP, and the rename is signature-safe because signing
      # happens after it).
      - name: Ad-hoc sign with sandbox entitlements + hardened runtime
        run: |
          set -euo pipefail
          APP=$(find build/dd/Build/Products -maxdepth 3 -name '*.app' -type d | head -1)
          DEST="$(dirname "$APP")/NOOP.app"
          [ "$APP" = "$DEST" ] || mv "$APP" "$DEST"
          APP="$DEST"
          while IFS= read -r nested; do
            [ -e "$nested" ] || continue
            codesign --force --options runtime --sign - "$nested"
          done < <(find "$APP/Contents/PlugIns" "$APP/Contents/Frameworks" -mindepth 1 -maxdepth 1 \
                     \( -name '*.appex' -o -name '*.framework' -o -name '*.dylib' \) 2>/dev/null)
          codesign --force --options runtime \
            --entitlements Strand/Resources/Strand.entitlements --sign - "$APP"
          codesign --verify --deep --verbose=2 "$APP"
          echo "--- entitlements as signed ---"
          codesign -d --entitlements - "$APP"
          codesign -d --entitlements - "$APP" 2>/dev/null | grep -q 'com.apple.security.app-sandbox' \
            || { echo "::error::app-sandbox entitlement missing from signature"; exit 1; }

      - name: Package
        id: pkg
        run: |
          set -euo pipefail
          APP=$(find build/dd/Build/Products -maxdepth 3 -name 'NOOP.app' -type d | head -1)
          VER=$(grep -m1 'MARKETING_VERSION:' project.yml | sed -E 's/.*"([^"]+)".*/\1/')
          ZIP="NOOP-macos-trusted-v${VER}-${GITHUB_SHA::12}.zip"
          ditto -c -k --keepParent "$APP" "$ZIP"
          shasum -a 256 "$ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      # Provenance is attested over the INNER zip (the exact bytes installed locally),
      # not the artifact wrapper upload-artifact adds around it.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.pkg.outputs.zip }}

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NOOP-macos-trusted
          path: ${{ steps.pkg.outputs.zip }}
          if-no-files-found: error
